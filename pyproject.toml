[project]
name = "yogya"
version = "1.0.0"
description = "Entitlement finder for families who qualify for benefits nobody told them about"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mayank" }]
keywords = ["langgraph", "multi-agent", "welfare", "rag", "govtech", "india"]

dependencies = [
  "langgraph>=1.2,<2",
  "langchain-core>=1.0,<2",
  "litellm>=1.70",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "rank-bm25>=0.2.2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24"]

[project.scripts]
yogya-demo = "yogya.demo:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yogya = ["data/corpus/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: exercises the compiled graph or the HTTP API end to end"]

[tool.coverage.run]
source = ["src/yogya"]
omit = ["*/demo.py"]
